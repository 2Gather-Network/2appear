<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop invitations · 2Appear</title>
<style>
  :root{ --bg:#1F699E; --brand:#1F699E; --ink:#1A2E42; --soft:#2F3D4F; --line:#DDE4EE; --card:#fff; }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:'Nunito Sans','DM Sans','Inter',system-ui,sans-serif;}
  .cw-card{background:var(--card);border-radius:14px;padding:22px 24px;border:1px solid var(--line);margin:16px;max-width:460px;width:100%;}
  .cw-pq{font-size:20px;font-weight:800;line-height:1.3;color:var(--ink);margin:0 0 12px;}
  .cw-statement{font-size:16px;font-weight:400;line-height:1.55;color:var(--ink);margin:0 0 20px;}
  .cw-btn{background:#fff;color:var(--brand);border:0;padding:10px 18px;border-radius:24px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;}
  .cw-btn.solid{background:var(--brand);color:#fff;}
  .cw-btn.form{padding:11px 22px;border-radius:26px;}
  .cw-btn:disabled{opacity:.5;cursor:not-allowed;}
  .cw-status{border-radius:10px;margin:14px 0 0;}
  .cw-status.info{background:#E8F2F9;color:var(--ink);padding:10px 14px;font-size:13.5px;font-weight:400;line-height:1.5;}
  .cw-status:empty{display:none;}
  @media(max-width:600px){.cw-card{padding:18px 16px;}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico">
</head>
<body>
  <div class="cw-card">
    <h1 class="cw-pq">Stop invitations from 2Appear</h1>
    <p class="cw-statement" id="lede">After this, nobody can send you an event or group invitation from 2Appear.</p>
    <button type="button" class="cw-btn solid form" id="stop">Stop invitations</button>
    <p class="cw-status info" id="say" role="status"></p>
  </div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var i = String(q.get('i') || ''), t = String(q.get('t') || '');
  var btn = document.getElementById('stop'), say = document.getElementById('say');
  if (!i || !t) { btn.style.display = 'none'; document.getElementById('lede').style.display = 'none'; say.textContent = 'This link has already been used or is no longer valid.'; return; }
  btn.addEventListener('click', function(){
    btn.disabled = true;
    say.textContent = 'Stopping…';
    fetch('https://cw-api-gate.jessieupp.workers.dev?action=stopEventInvites&i=' + encodeURIComponent(i) + '&t=' + encodeURIComponent(t), { referrerPolicy: 'no-referrer' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        say.textContent = (d && d.message) ? d.message : 'That did not go through. Try again in a moment.';
        if (d && d.status) { btn.style.display = 'none'; document.getElementById('lede').style.display = 'none'; }
        else { btn.disabled = false; }
      })
      .catch(function(){ btn.disabled = false; say.textContent = 'Could not reach the server. Try again in a moment.'; });
  });
})();
</script>
</body>
</html>
