<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:site_name" content="Appear">
<meta property="og:title" content="Appear in your network. Make your network appear.">
<title>Code of Conduct · 2Appear</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#1F699E;--ink:#1A2E42;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--brand);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:64px 18px;}
  .card{background:#fff;border-radius:16px;padding:26px 24px 22px;}
  p{font-size:18px;line-height:1.55;margin:0 0 18px;}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;}
  a.read{font-size:16px;font-weight:700;color:var(--brand);}
  button{font:inherit;font-size:16px;font-weight:700;padding:11px 22px;border-radius:24px;border:0;background:var(--brand);color:#fff;cursor:pointer;}
  button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <p>You read the Code of Conduct on 2Gather. It applies here on 2Appear too.</p>
  <div class="row">
    <a class="read" href="/code-of-conduct.html">Read it again</a>
    <button type="button" id="ok">I agree</button>
  </div>
</div></div>
<script>
(function(){
  var next='/';
  try{var n=new URLSearchParams(location.search).get('next');if(n&&n.charAt(0)==='/'&&n.charAt(1)!=='/'){next=n;}}catch(e){}
  document.getElementById('ok').onclick=function(){location.href=next;};
})();
</script>
</body>
</html>
